name: OpenStudy
options:
  bundleIdPrefix: com.openstudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  OpenStudy:
    type: application
    platform: iOS
    sources:
      - path: OpenStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openstudy.shelf
        PRODUCT_NAME: OpenStudy
        INFOPLIST_FILE: OpenStudy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  OpenStudyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenStudyTests
      - path: OpenStudy/Engine
      - path: OpenStudy/Resources/sample-library.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openstudy.shelf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenStudy:
    build:
      targets:
        OpenStudy: all
        OpenStudyTests: [test]
    test:
      targets:
        - OpenStudyTests
